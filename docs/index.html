<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITML — Linguagem Declarativa para Páginas Modernas</title>
</head>
<body>

    <!-- Script oficial do motor GITML (carregado localmente ou via CDN) -->
    <script src="gitml.js"></script>

    <!-- Bloco de marcação GITML interpretado pelo runtime -->
    <script type="text/gitml">
    <gitml
      theme="dark"
      accent="emerald"
      font="manrope"
      title="GITML — Linguagem Declarativa para Páginas Modernas"
      description="Crie páginas web completas e componentes reutilizáveis direto em marcação limpa. Funciona de forma independente ou integrada ao HTML.">

      <head lang="pt-BR" />
      <body class="gitml-landing">
        <banner href="#ecosystem">🚀 GITML publicado com sucesso no npm, VS Code Marketplace e GitHub Actions! — Conhecer ecossistema</banner>

        <header>
          <nav brand="GITML" sticky>
            <dropdown label="Ecossistema">
              <link href="#recursos">Recursos principais</link>
              <link href="#instalacao">Como instalar (CLI)</link>
              <link href="#extensao">Extensão VS Code</link>
            </dropdown>
            <link href="#vantagens">Vantagens</link>
            <link href="#comunidade">Comunidade</link>
            <theme-toggle />
            <button href="https://www.npmjs.com/package/gitml" variant="primary" icon="package" target="_blank">Ver no NPM</button>
          </nav>
        </header>

        <main id="inicio">
          <hero
            variant="split"
            eyebrow="LANÇAMENTO OFICIAL · v0.1.2"
            title="O poder do HTML sem a complexidade, **em código puro.**"
            subtitle="GITML é uma linguagem declarativa moderna projetada para criar interfaces incríveis com zero JavaScript de interface. Use de forma independente ou direto no seu projeto."
            cta="Instalar via NPM" href="#instalacao"
            cta2="Ver no GitHub" href="https://github.com/Gislaine-web3/gitml-language-NPM"
            image="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=85">
            <badge variant="success">● Publicado no npm, VS Code e GitHub Actions</badge>
          </hero>

          <section id="ecosystem" eyebrow="ESTRUTURA COMPLETA" title="Tudo o que você precisa para criar" subtitle="Um ecossistema robusto testado, validado e automatizado por pipelines modernas.">
            <grid cols="3" gap="20">
              <article>
                <card title="NPM Registry" icon="package" variant="soft">
                  <p>Pacote público otimizado e pronto para gerenciar dependências e comandos globais.</p>
                  <badge variant="primary">Disponível globalmente</badge>
                </card>
              </article>
              <article>
                <card title="VS Code Extension" icon="code" variant="soft">
                  <p>Syntax highlighting, snippets personalizados e pré-visualização em tempo real.</p>
                  <badge variant="success">Marketplace ativo</badge>
                </card>
              </article>
              <article>
                <card title="GitHub Actions" icon="cpu" variant="soft">
                  <p>Automação completa de CI/CD para build, testes e publicações contínuas.</p>
                  <badge variant="warning">Pipeline 100% verde</badge>
                </card>
              </article>
            </grid>
          </section>

          <section id="recursos" eyebrow="COMO FUNCIONA" title="Escreva menos, construa mais" subtitle="Veja um exemplo prático da sintaxe limpa e declarativa do GITML.">
            <grid cols="2" gap="24">
              <article>
                <h3>Exemplo de código `.gitml`</h3>
                <p>Componentes nativos que se traduzem automaticamente em páginas web rápidas, acessíveis e altamente customizáveis.</p>
                <ul icon="check">
                  <li>Sem necessidade de configurar boilerplates complexos de JS.</li>
                  <li>Suporte a temas dinâmicos (Claro/Escuro nativos).</li>
                  <li>Componentes visuais ricos embutidos (Gráficos, Cards, Hero, Grids).</li>
                </ul>
              </article>
              <aside>
                <code lang="html" title="index.gitml">
                  &lt;gitml theme="dark" accent="emerald" title="Meu Site"&gt;
                    &lt;body&gt;
                      &lt;hero title="Olá, Mundo GITML!" /&gt;
                      &lt;grid cols="3"&gt;
                        &lt;card title="Rápido" icon="zap"&gt;Compila em segundos&lt;/card&gt;
                      &lt;/grid&gt;
                    &lt;/body&gt;
                  &lt;/gitml&gt;
                </code>
              </aside>
            </grid>
          </section>

          <section id="instalacao" eyebrow="PRONTO PARA USO" title="Instale o CLI no seu terminal" subtitle="Com apenas um comando você inicia o servidor de desenvolvimento local.">
            <card title="Comandos rápidos do ecossistema GITML" icon="terminal" variant="soft">
              <p>Para instalar ou rodar o ambiente de desenvolvimento local diretamente no seu Git Bash / VS Code:</p>
              <code lang="bash" title="Terminal">
                npm install -g gitml
                npx gitml serve index.gitml --port 3000 --open
              </code>
              <spacer size="16" />
              <actions>
                <button href="https://github.com/Gislaine-web3/gitml-language-NPM" variant="primary" icon="external">Acessar Repositório Oficial</button>
                <button href="https://www.npmjs.com/package/gitml" variant="outline" icon="package">Ver Página no NPM</button>
              </actions>
            </card>
          </section>
        </main>

        <footer brand="GITML">
          <p>Desenvolvido com paixão por tecnologia, automação e código limpo. Projeto open-source sob licença MIT.</p>
          <address>Repositório oficial: github.com/Gislaine-web3/gitml-language-NPM</address>
          <link href="#inicio">Voltar ao topo</link>
          <social github="https://github.com/Gislaine-web3/gitml-language-NPM" site="https://npmjs.com" />
        </footer>

        <cookie button="Entendi">Este site de demonstração utiliza a sintaxe oficial do GITML.</cookie>
        <backtotop />
      </body>
    </gitml>
    </script>

</body>
</html>
